<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitação Recebida | Seu Espaço</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Google Tag Manager: replace GOOGLE_TAG_MANAGER_ID -->
  <!-- Meta Pixel: replace META_PIXEL_ID -->
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

  <!-- HEADER SIMPLES -->
  <header class="lp-header" style="border-bottom: 1px solid var(--gray-100);">
    <div class="container lp-header-inner" style="justify-content: center;">
      <a href="/" class="logo" aria-label="Seu Espaço — Página inicial">
        <img src="/images/logo.png" alt="Seu Espaço" style="height: 54px; width: auto;" />
      </a>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:60px 20px;">
    <div style="text-align:center; max-width:500px;">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:80px; height:80px; background:rgba(11, 149, 89, 0.1); color:var(--success); border-radius:50%; margin-bottom:24px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 class="display" style="font-size:32px; margin-bottom:16px;">Recebemos sua solicitação.</h1>
      <p class="subtitle" style="margin-bottom:32px;">Nossa equipe entrará em contato para entender sua necessidade e preparar uma proposta comercial para a sua empresa.</p>
      <a href="/" class="btn btn-primary btn-lg">Voltar para a página inicial</a>
    </div>
  </main>

  <!-- MINI FOOTER -->
  <footer class="site-footer">
    <div class="footer-bar">
      <div class="container footer-bar-inner">
        <p>© <span data-year></span> Seu Espaço. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
